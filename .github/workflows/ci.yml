name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Tests und Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      # Deutsche Zeitzone, damit Datumsfehler um die Zeitumstellung auffallen
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installieren
        run: npm ci
      - name: TypeScript prüfen
        run: npm run typecheck
      - name: Testen
        run: npm test
      - name: Frontend bauen
        run: npm run build
