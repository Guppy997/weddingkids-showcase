name: Fehler melden
description: Etwas im Showcase funktioniert nicht so, wie es soll.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. Screenshots bitte nur mit den Demo-Daten (`npm run seed:demo`).
        **Sicherheitslücken bitte nicht hier**, sondern vertraulich wie in SECURITY.md beschrieben.

  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Kurz und konkret. Fehlermeldungen gern als Text einfügen.
    validations:
      required: true

  - type: textarea
    id: erwartet
    attributes:
      label: Was hast du erwartet?
    validations:
      required: true

  - type: textarea
    id: schritte
    attributes:
      label: Wie lässt sich das nachstellen?
      placeholder: |
        1. Als `marie` mit `demo1234` anmelden
        2. Anfragen öffnen
        3. Bei „Mia & Ben“ auf „Vielleicht“ tippen
        4. …
    validations:
      required: true

  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options:
        - Anmeldung und Konto
        - Board
        - Anfragen und Rückmeldungen
        - Plan und Kalender
        - Aufgaben
        - News und Abstimmungen
        - Admin und Einteilung
        - Push-Benachrichtigungen
        - Entwicklung (Setup, Tests, Build)
        - Anderes
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Steht in der App im Profil, oder der Commit, von dem du gebaut hast.
      placeholder: z. B. 1.19.1

  - type: input
    id: geraet
    attributes:
      label: Gerät und Browser
      placeholder: z. B. iPhone, Safari, als PWA installiert

  - type: checkboxes
    id: check
    attributes:
      label: Kurz geprüft
      options:
        - label: Ich habe nach einem bestehenden Issue zum selben Fehler gesucht.
          required: true
        - label: Das ist keine Sicherheitslücke (sonst bitte vertraulich melden).
          required: true
