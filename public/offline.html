<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeddingKids – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f9f9f9;
      color: #333;
    }
    .box {
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 16px rgba(0,128,128,0.2);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #222;
      margin-bottom: 0.75rem;
    }
    p {
      color: #888;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    button {
      padding: 0.85rem 2rem;
      background: #008080;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,128,128,0.25);
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icon-512.png" alt="WeddingKids Logo" class="logo" />
    <h1>WeddingKids</h1>
    <p>Du bist gerade offline.<br/>Bitte prüfe deine Internetverbindung.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
